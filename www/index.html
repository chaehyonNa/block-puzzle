<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1f3b">
<title>블록 퍼즐</title>
<style>
  :root {
    --bg1: #1b1f3b;
    --bg2: #2c2560;
    --board: #151832;
    --empty: #23284d;
    --text: #f3f4ff;
    --muted: #9aa0d0;
    --accent: #ffcf4a;
    --bw: min(calc(100vw - 32px), 460px, calc(100vh - 290px));
    --gap: 3px;
  }
  @supports (height: 100dvh) {
    :root { --bw: min(calc(100vw - 32px), 460px, calc(100dvh - 290px)); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%;
    overscroll-behavior: none;
  }
  body {
    background: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg1));
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
    overflow: hidden;
  }
  #app {
    height: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
    display: flex; flex-direction: column; align-items: center;
    justify-content: space-evenly;
    gap: 12px;
  }

  /* ---- 점수 영역 ---- */
  header { width: var(--bw); display: flex; flex-direction: column; align-items: center; }
  .best {
    align-self: flex-start;
    font-size: 15px; font-weight: 700; color: var(--accent);
    display: flex; align-items: center; gap: 6px;
  }
  .best svg { width: 20px; height: 20px; fill: var(--accent); }
  .score {
    font-size: clamp(40px, 12vw, 56px); font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: transform .15s;
  }
  .score.bump { transform: scale(1.12); }

  /* ---- 보드 ---- */
  .board-wrap { position: relative; }
  #board {
    width: var(--bw); height: var(--bw);
    padding: 6px;
    background: var(--board);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.04);
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: var(--gap);
  }
  .cell {
    border-radius: 5px;
    background: var(--empty);
    box-shadow: inset 0 2px 0 rgba(0,0,0,.25);
  }
  .cell.filled, .ghost > div, .piece > div {
    background: var(--c);
    box-shadow:
      inset 0 3px 0 rgba(255,255,255,.35),
      inset 0 -4px 0 rgba(0,0,0,.25);
  }
  .cell.preview {
    background: var(--pc);
    opacity: .5;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,0,0,.25);
  }
  .cell.hl {
    background: var(--pc);
    opacity: 1;
    filter: brightness(1.15);
  }
  .cell.pop { animation: pop .18s ease-out; }
  .cell.clearing { animation: clear .32s ease-in forwards; }
  @keyframes pop { from { transform: scale(.7); } to { transform: scale(1); } }
  @keyframes clear {
    0% { transform: scale(1); filter: brightness(1.6); }
    100% { transform: scale(0); opacity: 0; }
  }

  .popup {
    position: absolute; left: 50%; top: 45%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    text-align: center;
    font-weight: 900;
    text-shadow: 0 3px 0 rgba(0,0,0,.35);
    animation: rise .9s ease-out forwards;
    white-space: nowrap;
  }
  .popup .pts { font-size: 34px; }
  .popup .combo { font-size: 22px; color: var(--accent); }
  @keyframes rise {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -120%) scale(1); }
  }

  /* ---- 대기 블록 ---- */
  #tray {
    width: var(--bw);
    height: calc(var(--bw) * 0.34);
    min-height: 110px;
    display: grid; grid-template-columns: repeat(3, 1fr);
  }
  .slot {
    display: flex; align-items: center; justify-content: center;
    cursor: grab;
  }
  .piece { position: relative; transition: opacity .2s, filter .2s; }
  .piece > div { position: absolute; border-radius: 3px; }
  .piece.hidden { visibility: hidden; }
  .piece.blocked { opacity: .35; filter: grayscale(.8); }

  .ghost {
    position: fixed; left: 0; top: 0;
    pointer-events: none;
    z-index: 50;
    transform-origin: 0 0;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,.4));
  }
  .ghost > div { position: absolute; border-radius: 5px; }

  /* ---- 게임 오버 ---- */
  #over, #pause {
    position: fixed; inset: 0;
    background: rgba(10, 12, 30, .75);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 16px;
    animation: fade .3s ease-out;
  }
  @keyframes fade { from { opacity: 0; } }
  .over-card {
    background: linear-gradient(180deg, #3a3380, #262158);
    border-radius: 20px;
    padding: 28px 24px;
    width: min(100%, 320px);
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  .over-card h2 { margin: 0 0 16px; font-size: 28px; }
  .over-card .label { color: var(--muted); font-size: 14px; }
  .over-card .val { font-size: 44px; font-weight: 800; margin-bottom: 10px; }
  .over-card .val.small { font-size: 26px; color: var(--accent); }
  .newbest { color: var(--accent); font-weight: 800; margin-bottom: 8px; }
  .btn {
    display: block;
    margin-top: 12px;
    width: 100%;
    padding: 14px;
    font: inherit; font-size: 18px; font-weight: 800;
    color: #1b1f3b;
    background: var(--accent);
    border: 0; border-radius: 12px;
    box-shadow: 0 4px 0 #c99a1c;
    cursor: pointer;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c99a1c; }
  .btn.sub {
    color: var(--text);
    background: rgba(255,255,255,.12);
    box-shadow: 0 4px 0 rgba(0,0,0,.25);
  }
  .btn.sub:active { box-shadow: 0 2px 0 rgba(0,0,0,.25); }

  /* ---- 상단 바 (최고 점수 + 일시정지) ---- */
  .topbar { width: 100%; display: flex; justify-content: space-between; align-items: center; }
  #pauseBtn {
    width: 40px; height: 40px;
    border: 0; border-radius: 10px;
    background: rgba(255,255,255,.1);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  #pauseBtn svg { width: 20px; height: 20px; fill: var(--text); }
  #pauseBtn:active { transform: scale(.94); }

  /* ---- 시작 화면 ---- */
  #title {
    position: fixed; inset: 0;
    z-index: 200;
    background: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg1));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 24px calc(env(safe-area-inset-bottom, 0px) + 24px);
    text-align: center;
  }
  #title.leaving { animation: leave .35s ease-in forwards; }
  @keyframes leave { to { opacity: 0; transform: scale(1.06); } }
  .logo {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    width: min(62vw, 240px);
    margin-bottom: 28px;
  }
  .logo > div { aspect-ratio: 1; border-radius: 7px; }
  .logo > .on {
    background: var(--c);
    box-shadow: inset 0 4px 0 rgba(255,255,255,.35), inset 0 -5px 0 rgba(0,0,0,.25);
    animation: drop .5s cubic-bezier(.3,1.5,.6,1) backwards, bob 2.4s ease-in-out infinite;
  }
  @keyframes drop { from { transform: translateY(-120px); opacity: 0; } }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  .title-name {
    margin: 0;
    font-size: clamp(40px, 13vw, 60px);
    font-weight: 900;
    letter-spacing: -1px;
    text-shadow: 0 4px 0 rgba(0,0,0,.35);
  }
  .title-sub { color: var(--muted); margin: 6px 0 26px; font-size: 15px; }
  .title-best {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(0,0,0,.25);
    color: var(--accent);
    font-weight: 800; font-size: 18px;
    margin-bottom: 28px;
  }
  .title-best svg { width: 20px; height: 20px; fill: var(--accent); }
  .title-actions { width: min(100%, 280px); }
  #startBtn { font-size: 22px; padding: 18px; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  .title-help { margin-top: 26px; color: var(--muted); font-size: 13px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="topbar">
      <div class="best">
        <svg viewBox="0 0 24 24"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5L3 7z"/></svg>
        <span id="best">0</span>
      </div>
      <button id="pauseBtn" aria-label="일시정지">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
    </div>
    <div class="score" id="score">0</div>
  </header>

  <div class="board-wrap">
    <div id="board"></div>
  </div>

  <div id="tray">
    <div class="slot" data-i="0"></div>
    <div class="slot" data-i="1"></div>
    <div class="slot" data-i="2"></div>
  </div>
</div>

<div id="over" hidden>
  <div class="over-card">
    <h2>게임 오버</h2>
    <div class="newbest" id="newbest" hidden>🎉 새 최고 기록!</div>
    <div class="label">점수</div>
    <div class="val" id="finalScore">0</div>
    <div class="label">최고 점수</div>
    <div class="val small" id="finalBest">0</div>
    <button class="btn" id="restart">다시하기</button>
    <button class="btn sub" id="overHome">처음 화면</button>
  </div>
</div>

<div id="pause" hidden>
  <div class="over-card">
    <h2>일시정지</h2>
    <button class="btn" id="resume">계속하기</button>
    <button class="btn sub" id="pauseRestart">처음부터 다시</button>
    <button class="btn sub" id="pauseHome">처음 화면</button>
  </div>
</div>

<div id="title">
  <div class="logo" id="logo"></div>
  <h1 class="title-name">블록 퍼즐</h1>
  <p class="title-sub">블록을 채우고 줄을 지워라!</p>
  <div class="title-best">
    <svg viewBox="0 0 24 24"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5L3 7z"/></svg>
    최고 점수 <span id="titleBest">0</span>
  </div>
  <div class="title-actions">
    <button class="btn" id="startBtn">게임 시작</button>
  </div>
  <p class="title-help">블록을 끌어서 판에 놓으세요<br>가로·세로 줄을 채우면 사라져요</p>
</div>

<script>
(() => {
  const N = 8;
  const BEST_KEY = 'blockPuzzleBest';

  const COLORS = ['#ff5e7e', '#ff9f43', '#ffd23f', '#3ddc84', '#2ec4ff', '#5b7cff', '#b06cff', '#ff6bd6'];

  // ---------- 블록 정의 ----------
  const line = n => Array.from({ length: n }, (_, i) => [0, i]);
  const rect = (h, w) => {
    const out = [];
    for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) out.push([r, c]);
    return out;
  };
  // [기본 모양, 가중치]
  const FAMILIES = [
    [[[0, 0]], 1],                                  // 1칸
    [line(2), 2],                                   // 2칸 일자
    [line(3), 2],                                   // 3칸 일자
    [line(4), 2],                                   // 4칸 일자
    [line(5), 1],                                   // 5칸 일자
    [rect(2, 2), 2],                                // 2x2
    [rect(3, 3), 1],                                // 3x3
    [rect(2, 3), 1],                                // 2x3
    [[[0, 0], [1, 0], [1, 1]], 2],                  // 작은 L
    [[[0, 0], [1, 0], [2, 0], [2, 1]], 2],          // L
    [[[0, 1], [1, 1], [2, 1], [2, 0]], 2],          // J
    [[[0, 0], [0, 1], [0, 2], [1, 1]], 2],          // T
    [[[0, 1], [0, 2], [1, 0], [1, 1]], 1],          // S
    [[[0, 0], [0, 1], [1, 1], [1, 2]], 1],          // Z
    [[[0, 0], [1, 0], [2, 0], [2, 1], [2, 2]], 1],  // 큰 L
  ];

  function normalize(cells) {
    const minR = Math.min(...cells.map(c => c[0]));
    const minC = Math.min(...cells.map(c => c[1]));
    return cells.map(([r, c]) => [r - minR, c - minC]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  }
  const rotate = cells => normalize(cells.map(([r, c]) => [c, -r]));
  function orientations(base) {
    const seen = new Set(), out = [];
    let cur = normalize(base);
    for (let i = 0; i < 4; i++) {
      const key = JSON.stringify(cur);
      if (!seen.has(key)) { seen.add(key); out.push(cur); }
      cur = rotate(cur);
    }
    return out;
  }
  const SHAPE_POOL = FAMILIES.map(([base, w]) => ({ forms: orientations(base), w }));
  const TOTAL_W = SHAPE_POOL.reduce((s, f) => s + f.w, 0);

  function randomPiece() {
    let x = Math.random() * TOTAL_W, fam = SHAPE_POOL[0];
    for (const f of SHAPE_POOL) { if ((x -= f.w) < 0) { fam = f; break; } }
    const cells = fam.forms[Math.floor(Math.random() * fam.forms.length)];
    return {
      cells,
      h: Math.max(...cells.map(c => c[0])) + 1,
      w: Math.max(...cells.map(c => c[1])) + 1,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
    };
  }

  // ---------- 상태 ----------
  let grid, pieces, score, best = 0, gameOver = false, drag = null, clearTimer = null;

  function loadBest() {
    try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) { best = 0; }
  }
  function saveBest() {
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
  }

  // ---------- DOM ----------
  const boardEl = document.getElementById('board');
  const boardWrap = document.querySelector('.board-wrap');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const slots = [...document.querySelectorAll('.slot')];
  const overEl = document.getElementById('over');

  const cellEls = [];
  for (let i = 0; i < N * N; i++) {
    const d = document.createElement('div');
    d.className = 'cell';
    boardEl.appendChild(d);
    cellEls.push(d);
  }
  const cellAt = (r, c) => cellEls[r * N + c];

  // 칸 크기 측정: 애니메이션(scale) 영향을 받지 않도록 offset 값(레이아웃 크기)을 사용
  function metrics() {
    const a = cellEls[0], b = cellEls[1];
    const wrap = boardWrap.getBoundingClientRect();
    return {
      ox: wrap.left + a.offsetLeft,
      oy: wrap.top + a.offsetTop,
      cell: a.offsetWidth,
      step: b.offsetLeft - a.offsetLeft,
    };
  }

  // ---------- 로직 ----------
  function canPlace(p, r, c) {
    for (const [dr, dc] of p.cells) {
      const rr = r + dr, cc = c + dc;
      if (rr < 0 || cc < 0 || rr >= N || cc >= N || grid[rr][cc]) return false;
    }
    return true;
  }
  function fitsAnywhere(p) {
    for (let r = 0; r <= N - p.h; r++)
      for (let c = 0; c <= N - p.w; c++)
        if (canPlace(p, r, c)) return true;
    return false;
  }
  // 놓았을 때 꽉 차는 줄 계산 (tmp: 놓을 칸 집합)
  function fullLines(extra) {
    const filled = (r, c) => !!grid[r][c] || (extra && extra.has(r * N + c));
    const rows = [], cols = [];
    for (let i = 0; i < N; i++) {
      let rf = true, cf = true;
      for (let j = 0; j < N; j++) {
        if (!filled(i, j)) rf = false;
        if (!filled(j, i)) cf = false;
      }
      if (rf) rows.push(i);
      if (cf) cols.push(i);
    }
    return { rows, cols };
  }

  function deal() {
    pieces = [randomPiece(), randomPiece(), randomPiece()];
  }

  function place(i, r, c) {
    const p = pieces[i];
    for (const [dr, dc] of p.cells) grid[r + dr][c + dc] = p.color;
    pieces[i] = null;
    let gained = p.cells.length;

    const { rows, cols } = fullLines();
    const lines = rows.length + cols.length;

    if (clearTimer) { clearTimeout(clearTimer); clearTimer = null; }
    render();
    for (const [dr, dc] of p.cells) cellAt(r + dr, c + dc).classList.add('pop');

    if (lines > 0) {
      const toClear = new Set();
      rows.forEach(rr => { for (let j = 0; j < N; j++) toClear.add(rr * N + j); });
      cols.forEach(cc => { for (let j = 0; j < N; j++) toClear.add(j * N + cc); });
      toClear.forEach(k => {
        cellEls[k].classList.remove('pop');
        cellEls[k].classList.add('clearing');
        grid[Math.floor(k / N)][k % N] = null;
      });
      clearTimer = setTimeout(() => { clearTimer = null; render(); }, 340);

      // 기본 10점/줄, 동시에 여러 줄이면 줄 수만큼 배수 보너스
      const lineScore = 10 * lines * lines;
      gained += lineScore;
      showPopup(lineScore, lines);
    }

    addScore(gained);

    if (pieces.every(x => !x)) deal();
    renderTray();
    checkGameOver();
  }

  function addScore(n) {
    score += n;
    if (score > best) { best = score; saveBest(); }
    scoreEl.textContent = score;
    bestEl.textContent = best;
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');
    setTimeout(() => scoreEl.classList.remove('bump'), 150);
  }

  function showPopup(pts, lines) {
    const el = document.createElement('div');
    el.className = 'popup';
    el.innerHTML = (lines > 1 ? `<div class="combo">${lines}줄 콤보!</div>` : '') + `<div class="pts">+${pts}</div>`;
    boardWrap.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }

  function checkGameOver() {
    const left = pieces.filter(Boolean);
    if (left.length && !left.some(fitsAnywhere)) {
      gameOver = true;
      const id = gameId;
      setTimeout(() => { if (id === gameId && titleEl.hidden) showGameOver(); }, 700);
    }
  }

  let startBest = 0, gameId = 0;
  function showGameOver() {
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalBest').textContent = best;
    document.getElementById('newbest').hidden = !(score > startBest && score > 0);
    overEl.hidden = false;
  }

  function newGame() {
    gameId++;
    grid = Array.from({ length: N }, () => Array(N).fill(null));
    score = 0;
    gameOver = false;
    startBest = best;
    scoreEl.textContent = 0;
    bestEl.textContent = best;
    overEl.hidden = true;
    pauseEl.hidden = true;
    deal();
    render();
    renderTray();
  }

  // ---------- 렌더링 ----------
  function render() {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const el = cellAt(r, c), v = grid[r][c];
      el.className = v ? 'cell filled' : 'cell';
      if (v) el.style.setProperty('--c', v); else el.style.removeProperty('--c');
    }
  }

  function renderTray() {
    const m = metrics();
    const mini = m.cell * 0.5, miniStep = m.step * 0.5;
    slots.forEach((slot, i) => {
      slot.innerHTML = '';
      const p = pieces[i];
      if (!p) return;
      const el = document.createElement('div');
      el.className = 'piece';
      if (!fitsAnywhere(p)) el.classList.add('blocked');
      el.style.width = ((p.w - 1) * miniStep + mini) + 'px';
      el.style.height = ((p.h - 1) * miniStep + mini) + 'px';
      for (const [r, c] of p.cells) {
        const d = document.createElement('div');
        d.style.cssText = `left:${c * miniStep}px;top:${r * miniStep}px;width:${mini}px;height:${mini}px;--c:${p.color}`;
        el.appendChild(d);
      }
      slot.appendChild(el);
    });
  }

  let previewKey = null;
  function clearPreview() {
    previewKey = null;
    cellEls.forEach(el => el.classList.remove('preview', 'hl'));
  }
  function showPreview(p, r, c) {
    const key = r + ',' + c;
    if (key === previewKey) return;
    clearPreview();
    previewKey = key;
    boardEl.style.setProperty('--pc', p.color);
    const extra = new Set(p.cells.map(([dr, dc]) => (r + dr) * N + (c + dc)));
    extra.forEach(k => cellEls[k].classList.add('preview'));
    const { rows, cols } = fullLines(extra);
    rows.forEach(rr => { for (let j = 0; j < N; j++) cellAt(rr, j).classList.add('hl'); });
    cols.forEach(cc => { for (let j = 0; j < N; j++) cellAt(j, cc).classList.add('hl'); });
  }

  // ---------- 드래그 (마우스 + 터치: Pointer Events) ----------
  slots.forEach((slot, i) => {
    slot.addEventListener('pointerdown', e => {
      if (drag || gameOver || !pieces[i]) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      const p = pieces[i];
      const m = metrics();
      const ghost = document.createElement('div');
      ghost.className = 'ghost';
      const gw = (p.w - 1) * m.step + m.cell;
      const gh = (p.h - 1) * m.step + m.cell;
      ghost.style.width = gw + 'px';
      ghost.style.height = gh + 'px';
      for (const [r, c] of p.cells) {
        const d = document.createElement('div');
        d.style.cssText = `left:${c * m.step}px;top:${r * m.step}px;width:${m.cell}px;height:${m.cell}px;--c:${p.color}`;
        ghost.appendChild(d);
      }
      document.body.appendChild(ghost);
      const pieceEl = slot.querySelector('.piece');
      pieceEl.classList.add('hidden');

      drag = {
        i, p, m, ghost, gw, gh, pieceEl,
        id: e.pointerId,
        // 터치일 때는 손가락에 가리지 않도록 블록을 위로 띄움
        lift: e.pointerType === 'mouse' ? 0 : m.cell * 1.4 + gh / 2,
        target: null, done: false,
      };
      onMove(e);
      window.addEventListener('pointermove', onMove, { passive: false });
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onCancel);
    });
  });

  function onMove(e) {
    if (!drag || drag.done || e.pointerId !== drag.id) return;
    e.preventDefault();
    const { m, gw, gh, lift, p } = drag;
    const x = e.clientX - gw / 2;
    const y = e.clientY - gh / 2 - lift;
    drag.ghost.style.transform = `translate(${x}px, ${y}px)`;
    const c = Math.round((x - m.ox) / m.step);
    const r = Math.round((y - m.oy) / m.step);
    if (canPlace(p, r, c)) {
      drag.target = { r, c };
      showPreview(p, r, c);
    } else {
      drag.target = null;
      clearPreview();
    }
  }

  function detach() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
  }

  function onUp(e) {
    if (!drag || e.pointerId !== drag.id) return;
    finish(true);
  }
  function onCancel(e) {
    if (!drag || e.pointerId !== drag.id) return;
    finish(false);
  }

  function finish(allowPlace) {
    detach();
    clearPreview();
    const d = drag;
    d.done = true;
    if (allowPlace && d.target) {
      d.ghost.remove();
      drag = null;
      place(d.i, d.target.r, d.target.c);
      return;
    }
    // 원래 자리로 되돌리기
    const rect = d.pieceEl.getBoundingClientRect();
    d.ghost.style.transition = 'transform .2s ease-out';
    d.ghost.style.transform = `translate(${rect.left}px, ${rect.top}px) scale(0.5)`;
    setTimeout(() => {
      d.ghost.remove();
      d.pieceEl.classList.remove('hidden');
      drag = null;
    }, 210);
  }

  // ---------- 기타 ----------
  // ---------- 시작 화면 / 일시정지 ----------
  const titleEl = document.getElementById('title');
  const pauseEl = document.getElementById('pause');
  const $ = id => document.getElementById(id);

  function buildLogo() {
    // 5x5 장식용 블록 그림 (0 = 빈칸, 숫자 = COLORS 인덱스 + 1)
    const pattern = [
      1, 1, 0, 5, 5,
      1, 0, 0, 0, 5,
      0, 0, 3, 0, 0,
      7, 0, 3, 3, 4,
      7, 7, 0, 4, 4,
    ];
    const logo = $('logo');
    logo.innerHTML = '';
    let n = 0;
    pattern.forEach(v => {
      const d = document.createElement('div');
      if (v) {
        d.className = 'on';
        d.style.setProperty('--c', COLORS[v - 1]);
        const delay = (n++ * 0.06).toFixed(2);
        d.style.animationDelay = `${delay}s, ${(0.6 + n * 0.12).toFixed(2)}s`;
      }
      logo.appendChild(d);
    });
  }

  function showTitle() {
    $('titleBest').textContent = best;
    overEl.hidden = true;
    pauseEl.hidden = true;
    titleEl.classList.remove('leaving');
    titleEl.hidden = false;
    buildLogo();
  }

  function startGame() {
    newGame();
    titleEl.classList.add('leaving');
    setTimeout(() => { titleEl.hidden = true; titleEl.classList.remove('leaving'); }, 340);
  }

  $('startBtn').addEventListener('click', startGame);
  $('restart').addEventListener('click', newGame);
  $('overHome').addEventListener('click', showTitle);
  $('pauseBtn').addEventListener('click', () => {
    if (drag || gameOver) return;
    pauseEl.hidden = false;
  });
  $('resume').addEventListener('click', () => { pauseEl.hidden = true; });
  $('pauseRestart').addEventListener('click', newGame);
  $('pauseHome').addEventListener('click', showTitle);

  document.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('resize', () => { if (!drag && pieces) renderTray(); });

  loadBest();
  newGame();
  showTitle();
})();
</script>
</body>
</html>
