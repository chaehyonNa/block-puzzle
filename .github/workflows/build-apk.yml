name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'screenOrientation' "$MANIFEST" || \
            sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:screenOrientation="portrait"/' "$MANIFEST"
          # Play 스토어는 올릴 때마다 버전 번호가 커야 하므로 빌드 번호를 사용
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::GitHub Secrets 에 KEYSTORE_BASE64 가 없습니다"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release APK + AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Collect outputs
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk block-puzzle.apk
          mv android/app/build/outputs/bundle/release/app-release.aab block-puzzle.aab

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 블록 퍼즐 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            📱 폰 설치: 아래 **block-puzzle.apk** 를 눌러 다운로드 후 설치
            🏪 Play 스토어 업로드용: **block-puzzle.aab**
          files: |
            block-puzzle.apk
            block-puzzle.aab
