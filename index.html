<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f3b">
  <title>블록 퍼즐</title>
</head>
<body>
  <!-- ===== 게임 화면 ===== -->
  <div id="app">
    <header>
      <div class="topbar">
        <div class="best">
          <svg viewBox="0 0 24 24"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5L3 7z"/></svg>
          <span id="best">0</span>
        </div>
        <button id="pauseBtn" aria-label="일시정지">
          <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
      </div>
      <div class="score" id="score">0</div>
    </header>

    <div class="board-wrap">
      <div id="board"></div>
    </div>

    <div id="tray">
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
    </div>
  </div>

  <!-- ===== 게임 오버 ===== -->
  <div id="over" class="overlay" hidden>
    <div class="card">
      <h2>게임 오버</h2>
      <div class="newbest" id="newbest" hidden>🎉 새 최고 기록!</div>
      <div class="label">점수</div>
      <div class="val" id="finalScore">0</div>
      <div class="label">최고 점수</div>
      <div class="val small" id="finalBest">0</div>
      <button class="btn" id="restart">다시하기</button>
      <button class="btn sub" id="overHome">처음 화면</button>
    </div>
  </div>

  <!-- ===== 일시정지 ===== -->
  <div id="pause" class="overlay" hidden>
    <div class="card">
      <h2>일시정지</h2>
      <div class="toggles">
        <button class="toggle" id="soundToggle" aria-pressed="true">
          <span>🔊 소리</span><span class="switch"></span>
        </button>
        <button class="toggle" id="vibrationToggle" aria-pressed="true">
          <span>📳 진동</span><span class="switch"></span>
        </button>
      </div>
      <button class="btn" id="resume">계속하기</button>
      <button class="btn sub" id="pauseRestart">처음부터 다시</button>
      <button class="btn sub" id="pauseHome">처음 화면</button>
    </div>
  </div>

  <!-- ===== 시작 화면 ===== -->
  <div id="title">
    <div class="logo" id="logo"></div>
    <h1 class="title-name">블록 퍼즐</h1>
    <p class="title-sub">블록을 채우고 줄을 지워라!</p>
    <div class="title-best">
      <svg viewBox="0 0 24 24"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5L3 7z"/></svg>
      최고 점수 <span id="titleBest">0</span>
    </div>
    <div class="title-actions">
      <button class="btn" id="startBtn">게임 시작</button>
    </div>
    <p class="title-help">블록을 끌어서 판에 놓으세요<br>가로·세로 줄을 채우면 사라져요</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
